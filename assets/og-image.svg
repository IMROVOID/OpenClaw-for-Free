<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- OpenClaw Red Title Gradient -->
    <linearGradient id="textGradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4359" />
      <stop offset="50%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>

    <!-- Corner Radial Red Glows -->
    <radialGradient id="cornerGlowTL" cx="0%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowTR" cx="100%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowBL" cx="0%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowBR" cx="100%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-weight: 600; font-size: 21px; fill: #94a3b8; letter-spacing: 3.5px; text-transform: uppercase; }
  </style>

  <!-- Pure Black Background fitting exact 1200x630 canvas -->
  <rect width="1200" height="630" fill="#000000" />

  <!-- Corner Radial Glow Overlays -->
  <rect width="1200" height="630" fill="url(#cornerGlowTL)" pointer-events="none" />
  <rect width="1200" height="630" fill="url(#cornerGlowTR)" pointer-events="none" />
  <rect width="1200" height="630" fill="url(#cornerGlowBL)" pointer-events="none" />
  <rect width="1200" height="630" fill="url(#cornerGlowBR)" pointer-events="none" />

  <!-- Tiny White & Red Star Particles -->
  <g pointer-events="none">
    <!-- White Stars -->
    <circle cx="95" cy="90" r="1.8" fill="#ffffff" opacity="0.85" />
    <circle cx="160" cy="180" r="1.4" fill="#ffffff" opacity="0.6" />
    <circle cx="210" cy="440" r="1.8" fill="#ffffff" opacity="0.75" />
    <circle cx="270" cy="120" r="1.2" fill="#ffffff" opacity="0.5" />
    <circle cx="360" cy="520" r="1.6" fill="#ffffff" opacity="0.8" />
    <circle cx="480" cy="95" r="2.0" fill="#ffffff" opacity="0.9" />
    <circle cx="750" cy="80" r="1.6" fill="#ffffff" opacity="0.8" />
    <circle cx="860" cy="510" r="1.4" fill="#ffffff" opacity="0.65" />
    <circle cx="960" cy="130" r="1.8" fill="#ffffff" opacity="0.85" />
    <circle cx="1010" cy="460" r="1.3" fill="#ffffff" opacity="0.55" />
    <circle cx="1080" cy="160" r="2.0" fill="#ffffff" opacity="0.9" />
    <circle cx="1130" cy="290" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1145" cy="480" r="1.8" fill="#ffffff" opacity="0.85" />
    <circle cx="130" cy="320" r="1.5" fill="#ffffff" opacity="0.6" />
    <circle cx="520" cy="540" r="1.4" fill="#ffffff" opacity="0.7" />
    <circle cx="690" cy="535" r="1.3" fill="#ffffff" opacity="0.65" />

    <!-- Red & Crimson Stars -->
    <circle cx="70" cy="240" r="1.6" fill="#ff3366" opacity="0.75" />
    <circle cx="125" cy="70" r="2.0" fill="#ff4d6d" opacity="0.8" />
    <circle cx="190" cy="530" r="1.5" fill="#ff2a5f" opacity="0.65" />
    <circle cx="310" cy="150" r="1.8" fill="#ff4d6d" opacity="0.7" />
    <circle cx="410" cy="470" r="1.4" fill="#ff3366" opacity="0.6" />
    <circle cx="810" cy="540" r="1.6" fill="#ff4d6d" opacity="0.7" />
    <circle cx="910" cy="160" r="1.5" fill="#ff2a5f" opacity="0.6" />
    <circle cx="1030" cy="330" r="1.9" fill="#ff3366" opacity="0.8" />
    <circle cx="1110" cy="110" r="1.6" fill="#ff4d6d" opacity="0.75" />
    <circle cx="1135" cy="535" r="2.0" fill="#ff2a5f" opacity="0.8" />
    <circle cx="620" cy="105" r="1.5" fill="#ff3366" opacity="0.6" />

    <!-- Delicate Star Sparkles -->
    <path d="M100 480 Q100 485 105 485 Q100 485 100 490 Q100 485 95 485 Q100 485 100 480 Z" fill="#ffffff" opacity="0.8" />
    <path d="M1100 200 Q1100 205 1105 205 Q1100 205 1100 210 Q1100 205 1095 205 Q1100 205 1100 200 Z" fill="#ff4d6d" opacity="0.85" />
  </g>

  <!-- Main Title: OpenClaw * for free (Centered, Scaled for 1200x630) -->
  <text x="600" y="305" text-anchor="middle" filter="url(#shadow)">
    <tspan fill="url(#textGradPrimary)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="92px" letter-spacing="1px">OpenClaw</tspan>
    <tspan fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="44px" dx="16" dy="-9" letter-spacing="1px">* for free</tspan>
  </text>

  <!-- Subtitle: Grey Text (Scaled for 1200x630) -->
  <text x="600" y="365" text-anchor="middle" class="subtitle">
    Multi-Agent AI &amp; Free Cloud VPS Ecosystem
  </text>
</svg>