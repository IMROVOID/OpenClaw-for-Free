<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160" fill="none">
  <defs>
    <!-- OpenClaw Red Title Gradient -->
    <linearGradient id="textGradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4359" />
      <stop offset="50%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>

    <!-- Subtle Corner Radial Red Glows -->
    <radialGradient id="cornerGlowTL" cx="0%" cy="0%" r="32%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowTR" cx="100%" cy="0%" r="32%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowBL" cx="0%" cy="100%" r="32%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlowBR" cx="100%" cy="100%" r="32%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.55" />
      <stop offset="20%" stop-color="#2a0d12" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#141414" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#2a0d12" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0.55" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-weight: 600; font-size: 11.5px; fill: #94a3b8; letter-spacing: 2.2px; text-transform: uppercase; }
  </style>

  <!-- Pure Black Background Card -->
  <rect x="2" y="2" width="876" height="156" rx="14" fill="#000000" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner Radial Glow Overlays -->
  <rect x="2" y="2" width="876" height="156" rx="14" fill="url(#cornerGlowTL)" pointer-events="none" />
  <rect x="2" y="2" width="876" height="156" rx="14" fill="url(#cornerGlowTR)" pointer-events="none" />
  <rect x="2" y="2" width="876" height="156" rx="14" fill="url(#cornerGlowBL)" pointer-events="none" />
  <rect x="2" y="2" width="876" height="156" rx="14" fill="url(#cornerGlowBR)" pointer-events="none" />

  <!-- Tiny White & Red Star Particles -->
  <g pointer-events="none">
    <!-- White Stars -->
    <circle cx="68" cy="38" r="1.2" fill="#ffffff" opacity="0.85" />
    <circle cx="112" cy="72" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="155" cy="120" r="1.4" fill="#ffffff" opacity="0.8" />
    <circle cx="198" cy="34" r="0.8" fill="#ffffff" opacity="0.5" />
    <circle cx="260" cy="138" r="1.1" fill="#ffffff" opacity="0.75" />
    <circle cx="340" cy="28" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="560" cy="24" r="1.2" fill="#ffffff" opacity="0.8" />
    <circle cx="630" cy="136" r="1" fill="#ffffff" opacity="0.65" />
    <circle cx="705" cy="32" r="1.3" fill="#ffffff" opacity="0.85" />
    <circle cx="740" cy="122" r="0.9" fill="#ffffff" opacity="0.5" />
    <circle cx="790" cy="42" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="835" cy="78" r="1.1" fill="#ffffff" opacity="0.7" />
    <circle cx="850" cy="128" r="1.3" fill="#ffffff" opacity="0.85" />

    <!-- Red & Crimson Stars -->
    <circle cx="48" cy="95" r="1.2" fill="#ff3366" opacity="0.75" />
    <circle cx="90" cy="28" r="1.5" fill="#ff4d6d" opacity="0.8" />
    <circle cx="138" cy="142" r="1" fill="#ff2a5f" opacity="0.6" />
    <circle cx="225" cy="45" r="1.3" fill="#ff4d6d" opacity="0.7" />
    <circle cx="295" cy="125" r="1" fill="#ff3366" opacity="0.65" />
    <circle cx="600" cy="145" r="1.2" fill="#ff4d6d" opacity="0.7" />
    <circle cx="665" cy="44" r="1" fill="#ff2a5f" opacity="0.6" />
    <circle cx="755" cy="85" r="1.4" fill="#ff3366" opacity="0.8" />
    <circle cx="815" cy="30" r="1.2" fill="#ff4d6d" opacity="0.75" />
    <circle cx="840" cy="144" r="1.5" fill="#ff2a5f" opacity="0.8" />

    <!-- Delicate Star Sparkles -->
    <path d="M72 130 Q72 133 75 133 Q72 133 72 136 Q72 133 69 133 Q72 133 72 130 Z" fill="#ffffff" opacity="0.8" />
    <path d="M820 45 Q820 48 823 48 Q820 48 820 51 Q820 48 817 48 Q820 48 820 45 Z" fill="#ff4d6d" opacity="0.85" />
  </g>

  <!-- Corner Tech Accent Brackets -->
  <g stroke="#ff2a5f" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M18 26 L18 18 L26 18" />
    <path d="M862 26 L862 18 L854 18" />
    <path d="M18 134 L18 142 L26 142" />
    <path d="M862 134 L862 142 L854 142" />
  </g>

  <!-- Main Title: OpenClaw * for free (Bigger title, white asterisk, refined scale) -->
  <text x="440" y="78" text-anchor="middle" filter="url(#shadow)">
    <tspan fill="url(#textGradPrimary)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52px" letter-spacing="0.5px">OpenClaw</tspan>
    <tspan fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="25px" dx="8" dy="-5" letter-spacing="0.5px">* for free</tspan>
  </text>

  <!-- Subtitle: Smaller, Grey Text -->
  <text x="440" y="114" text-anchor="middle" class="subtitle">
    Multi-Agent AI &amp; Free Cloud VPS Ecosystem
  </text>
</svg>
