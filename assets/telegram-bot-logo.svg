<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048" fill="none">
  <defs>
    <!-- OpenClaw Red Title Gradient -->
    <linearGradient id="textGradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4359" />
      <stop offset="50%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Pure Solid Black Background -->
  <rect width="2048" height="2048" fill="#000000" />

  <!-- Mathematically & Optically Centered OFF Text -->
  <text x="1024" y="978" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="720px" letter-spacing="0px" fill="url(#textGradPrimary)">OFF</text>
</svg>
